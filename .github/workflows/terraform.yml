name: Terraform e GitOps

# PR para develop/main: fmt, validate, tflint, terraform test, render dos
# charts do GitOps e plan. Push em develop/main (merge do PR): apply no cluster.
# Execução manual (workflow_dispatch): apply ou destroy, para economizar o
# crédito do Learner Lab entre as sessões.
#
# Configuração (organização ou repositório), igual à pipeline da Lambda:
# - secrets AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN: sessão
#   atual do AWS Academy (AWS Details > AWS CLI), renovada a cada 4 horas;
# - variable AWS_DEPLOY_ENABLED=true liga plan/apply (sem ela só roda o CI);
# - opcionais: AWS_REGION (padrão us-east-1), TF_STATE_BUCKET (padrão
#   techchallenge-tfstate-<account-id>, criado automaticamente) e
#   AWS_DEPLOY_ROLE_ARN (OIDC fora do Academy, no lugar das chaves).
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      action:
        description: Ação no cluster
        type: choice
        options: [apply, destroy]
        default: apply

permissions:
  contents: read

env:
  TF_VERSION: 1.15.8
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  validate:
    name: Validar Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.65.0

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff terraform

      - name: terraform validate
        run: |
          for dir in terraform/cluster terraform/local terraform/modules/platform; do
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
          done

      - name: tflint
        run: |
          tflint --init
          for dir in terraform/cluster terraform/local terraform/modules/platform; do
            tflint --chdir="$dir" --config="$GITHUB_WORKSPACE/.tflint.hcl"
          done

      - name: terraform test (providers simulados)
        run: terraform -chdir=terraform/cluster test

  gitops:
    name: Renderizar GitOps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: App-of-apps
        run: |
          helm lint gitops
          helm template root gitops -n argocd > /dev/null
          helm template root gitops -n argocd --set profile=kind --set apps.enabled=false > /dev/null

      - name: Charts da plataforma
        run: |
          # Mesmos charts, versões e values das Applications em gitops/values.yaml.
          yq '.platform | to_entries | map(select(.value.chart)) | .[] | [.key, .value.chart.repoURL, .value.chart.name, .value.chart.version, .value.namespace] | @tsv' gitops/values.yaml \
          | while IFS=$'\t' read -r name repo chart version namespace; do
              for profile in eks kind; do
                args=(-f "gitops/platform/$name/values.yaml")
                [ -f "gitops/platform/$name/values-$profile.yaml" ] && args+=(-f "gitops/platform/$name/values-$profile.yaml")
                echo "::group::$name ($profile)"
                helm template "$name" "$chart" --repo "$repo" --version "$version" -n "$namespace" \
                  --api-versions monitoring.coreos.com/v1 "${args[@]}" > /dev/null
                echo "::endgroup::"
              done
            done

      - name: Diretórios de manifestos
        run: |
          kubectl kustomize gitops/platform/grafana-dashboards > /dev/null
          for file in gitops/platform/alerts/*.yaml gitops/platform/gateway/*.yaml gitops/platform/api-routes/*.yaml gitops/platform/mailpit/*.yaml; do
            yq -e '.' "$file" > /dev/null
          done
          for file in gitops/platform/grafana-dashboards/*.json; do
            jq -e '.uid' "$file" > /dev/null
          done

  plan:
    name: Plan
    if: github.event_name == 'pull_request' && vars.AWS_DEPLOY_ENABLED == 'true'
    needs: [validate, gitops]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: ./.github/actions/terraform-init
        with:
          working-directory: terraform/cluster
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          state-bucket: ${{ vars.TF_STATE_BUCKET }}

      - name: terraform plan
        run: terraform -chdir=terraform/cluster plan -lock=false -var region="$AWS_REGION"

  apply:
    name: ${{ inputs.action || 'apply' }} (${{ github.ref_name }})
    if: vars.AWS_DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [validate, gitops]
    runs-on: ubuntu-latest
    # Cluster único: homologação (develop) e produção (main) aplicam o mesmo
    # state, um de cada vez.
    environment: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
    concurrency:
      group: terraform-cluster
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: ./.github/actions/terraform-init
        with:
          working-directory: terraform/cluster
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          state-bucket: ${{ vars.TF_STATE_BUCKET }}

      - name: terraform ${{ inputs.action || 'apply' }}
        run: terraform -chdir=terraform/cluster "${{ inputs.action || 'apply' }}" -auto-approve -var region="$AWS_REGION"

      - name: Resumo
        if: inputs.action != 'destroy'
        run: |
          cluster=$(terraform -chdir=terraform/cluster output -raw cluster_name)
          {
            echo "### Cluster $cluster"
            echo
            echo '```bash'
            terraform -chdir=terraform/cluster output -raw kubeconfig_command
            echo
            echo "kubectl -n argocd get applications"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
