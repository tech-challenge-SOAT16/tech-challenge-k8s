{{- if .Values.apps.enabled }}
{{- range $name, $env := .Values.apps.environments }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $.Values.apps.wave | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ $.Values.apps.repoURL }}
    targetRevision: {{ $env.targetRevision }}
    path: {{ $env.path }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $env.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
{{- end }}
{{- end }}
