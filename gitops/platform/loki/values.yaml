# Loki monolítico com filesystem, sem caches, gateway nem canary. Recebe os
# logs da API pelo endpoint OTLP nativo (/otlp) via OpenTelemetry Collector.
deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 72h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  pattern_ingester:
    enabled: false
  ruler:
    enable_api: false

singleBinary:
  replicas: 1
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 192Mi

gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false

# Modo monolítico: componentes do modo simple scalable desligados.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# Sem regras do ruler carregadas por ConfigMap.
sidecar:
  rules:
    enabled: false
